<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>퀀타로 2027 랜딩 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* Layout: 리뷰 바(내부용, 회색 계열) 아래에 모바일 기둥 448px. 랜딩은 퀀타로 남색·금색 토큰만 사용. */
:root{
  color-scheme: dark;
  /* 브랜드 — 08_tokens 소스 추출값 */
  --navy-950:#0B1120; --navy-900:#101A30; --navy-850:#13213D; --navy-800:#16305A;
  --navy-700:#1B3B6F; --navy-500:#2E5A9E; --mist:#A9C0DE; --mist-2:#C9D8EA;
  --gold-200:#F5E6BE; --gold-300:#F0D9A0; --gold-400:#E2C074; --gold-600:#8C6D1F;
  --ivory:#F1E9DA; --paper:#FFFFFF; --paper-2:#F5F7FA; --ink:#211C1A; --ink-2:#222222; --muted:#5F5650;
  --line-light:#EAEAEA; --line-gold:rgba(226,192,116,.32); --line-gold-strong:rgba(226,192,116,.7);
  --line-dark:rgba(169,192,222,.16);
  /* 리뷰 셸 (랜딩과 분리된 회색) */
  --shell-bg:#D7D5D0; --shell-bar:#2B2B2E; --shell-fg:#EDEDED; --shell-dim:#9C9CA3; --shell-on:#FFFFFF;
  --todo:#FF9F6B;
  /* 타입 */
  --f-serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-sans:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  /* 간격·모서리 — 사이트 값 */
  --gutter:20px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --touch:44px;
  --col:448px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--shell-bg);color:var(--ivory);font-family:var(--f-sans);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--shell-bar)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-400);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}

/* ───────── 리뷰 셸 ───────── */
.shell-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--shell-bar);color:var(--shell-fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;border-bottom:1px solid #000}
.shell-inner{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.shell-tag{font-size:11px;letter-spacing:.06em;color:var(--shell-dim);white-space:nowrap}
.shell-tabs{display:flex;gap:4px;flex:1 1 auto;min-width:0}
.shell-tabs button{flex:1 1 0;min-width:0;min-height:36px;border:1px solid #47474d;background:transparent;color:var(--shell-dim);border-radius:8px;padding:4px 6px;cursor:pointer;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shell-tabs button b{color:var(--shell-fg);margin-right:4px}
.shell-tabs button[aria-pressed="true"]{background:var(--shell-on);color:#111;border-color:var(--shell-on)}
.shell-tabs button[aria-pressed="true"] b{color:#111}
.shell-widths{display:flex;gap:4px;align-items:center}
.shell-widths button{min-height:28px;border:1px solid #47474d;background:transparent;color:var(--shell-dim);border-radius:6px;padding:2px 7px;cursor:pointer;font-variant-numeric:tabular-nums}
.shell-widths button[aria-pressed="true"]{color:#111;background:var(--shell-fg)}
.shell-note{width:100%;color:var(--shell-dim);font-size:11px}
@media (max-width:520px){.shell-widths,.shell-tag{display:none}.shell-tabs button{font-size:12px}.shell-tabs button span{display:none}}

.stage{padding-block:24px 48px}
.phone{width:min(100%,var(--col));margin:0 auto;background:var(--navy-950);box-shadow:0 18px 60px rgba(20,20,30,.35);overflow:hidden;position:relative;border-radius:20px}
@media (max-width:520px){.stage{padding:0}.phone{width:100%;border-radius:0;box-shadow:none}}

/* ───────── 공통 컴포넌트 ───────── */
.wrap{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.todo{display:inline-flex;align-items:center;gap:4px;font:600 11.5px/1.35 var(--f-sans);color:var(--todo);border:1px dashed var(--todo);border-radius:6px;padding:2px 7px;background:rgba(255,159,107,.08);letter-spacing:0;word-break:keep-all;vertical-align:middle}
.todo::before{content:"[확인 필요]";font-weight:800}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--gold-400)}
.speaker{display:flex;gap:10px;align-items:baseline;font-size:15.5px;line-height:1.6}
.speaker b{flex:none;color:var(--gold-300);font-weight:800;letter-spacing:.08em}
.paid{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--navy-950);background:var(--gold-300);border-radius:999px;padding:1px 8px;line-height:18px;vertical-align:middle}

/* 버튼: 캡처의 남색 바탕 + 금색 테두리·글자 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 18px;border-radius:var(--r-lg);background:var(--navy-700);border:1.5px solid var(--gold-400);color:var(--gold-300);font-weight:800;font-size:16.5px;text-decoration:none;text-align:center;line-height:1.3;transition:background .2s,transform .15s}
.btn:hover{background:#21467f}
.btn:active{transform:translateY(1px)}
.btn .arr{font-family:var(--f-serif);font-weight:500}
.btn.gold{background:var(--gold-300);color:var(--navy-950);border-color:var(--gold-300)}
.btn.gold:hover{background:var(--gold-200)}
.btn.sm{min-height:48px;font-size:14.5px;padding:8px 10px;border-radius:var(--r-md)}

.frame{border:1px solid var(--line-gold-strong);border-radius:var(--r-lg);overflow:hidden;background:var(--navy-900)}
.frame img{width:100%;height:100%;object-fit:cover}

/* 사이트 헤더 */
.site-head{display:flex;align-items:center;justify-content:space-between;height:52px}
.site-head img{height:26px;width:auto}
.site-head .menu{font-size:12px;color:var(--mist);letter-spacing:.06em}
.site-head.light{background:var(--paper);border-bottom:1px solid var(--line-light)}
.site-head.light .menu{color:var(--muted)}
.site-head.dark{background:var(--navy-950);border-bottom:1px solid var(--line-dark)}
.site-head.overlay{position:absolute;inset:0 0 auto;z-index:3;background:linear-gradient(rgba(11,17,32,.7),rgba(11,17,32,0))}

/* FAQ 아코디언 */
.faq{display:flex;flex-direction:column;gap:8px}
.faq-item{border-radius:var(--r-md);border:1px solid var(--line-dark);background:var(--navy-900);overflow:hidden}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer;font-weight:700;font-size:15px;line-height:1.45}
.faq-q .ic{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-gold);display:grid;place-items:center;color:var(--gold-300);font-size:14px;transition:transform .25s}
.faq-q[aria-expanded="true"] .ic{transform:rotate(45deg)}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.faq-a.open{grid-template-rows:1fr}
.faq-a > div{overflow:hidden}
.faq-a p{padding:0 16px 16px;color:var(--mist-2);font-size:14.5px;line-height:1.75}
.faq.light .faq-item{background:var(--paper);border-color:var(--line-light)}
.faq.light .faq-q{color:var(--ink)}
.faq.light .faq-q .ic{border-color:var(--navy-700);color:var(--navy-700)}
.faq.light .faq-a p{color:var(--muted)}

/* 결과 미리보기 자리 */
.preview{border-radius:var(--r-lg);border:1px solid var(--line-gold);background:linear-gradient(180deg,var(--navy-850),var(--navy-900));padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px}
.preview-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.preview-head h4{font-size:15px;font-weight:800;color:var(--ivory)}
.preview-toc{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.preview-toc li{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--r-md);background:rgba(11,17,32,.55);border:1px solid var(--line-dark)}
.preview-toc li span{font-size:13px;font-weight:700;color:var(--gold-300)}
.skel{display:flex;flex-direction:column;gap:6px}
.skel i{display:block;height:8px;border-radius:4px;background:rgba(169,192,222,.16)}
.skel i:nth-child(2){width:86%}.skel i:nth-child(3){width:62%}
.preview-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mist)}

/* 정보 표 */
.facts{display:flex;flex-direction:column;border-top:1px solid var(--line-dark)}
.facts > div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-dark);font-size:14.5px}
.facts dt{color:var(--gold-300);font-weight:700}
.facts dd{margin:0;color:var(--mist-2);min-width:0}

/* 푸터 (사이트 푸터 실제 표기) */
.foot{padding-block:28px calc(32px + env(safe-area-inset-bottom,0px));font-size:12px;line-height:1.85;color:var(--mist);border-top:1px solid var(--line-dark);background:var(--navy-950)}
.foot b{color:var(--mist-2);font-weight:700;margin-right:4px}
.foot .seal{width:36px;height:36px;margin-bottom:10px;opacity:.9}
.foot.light{background:var(--paper-2);color:var(--muted);border-top-color:var(--line-light)}
.foot.light b{color:var(--ink-2)}
.foot .links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ═════════ A안 — 프리미엄 스토리텔링 ═════════ */
.va{background:var(--navy-950)}
.va-hero{position:relative;aspect-ratio:2/3;max-height:700px;min-height:520px;overflow:hidden}
.va-hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scale(1.03);animation:vaDrift 18s ease-out forwards}
@keyframes vaDrift{to{transform:scale(1)}}
.va-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,17,32,0) 38%,rgba(11,17,32,.72) 66%,var(--navy-950) 96%)}
.va-hero-copy{position:absolute;inset:auto 0 0;z-index:2;padding-bottom:28px;display:flex;flex-direction:column;gap:14px}
.va-hero h1{font-family:var(--f-serif);font-weight:900;font-size:clamp(30px,8.6vw,38px);line-height:1.28;letter-spacing:-.01em;color:var(--paper)}
.va-hero h1 em{font-style:normal;color:var(--gold-300)}
.va-hero p{color:var(--mist-2);font-size:15px}
.va-cue{display:flex;align-items:center;gap:10px;color:var(--gold-400);font-size:12px;letter-spacing:.14em}
.va-cue::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-gold-strong),transparent)}

.va-ch{padding-block:64px 8px;display:flex;flex-direction:column;gap:22px}
.va-chno{display:flex;align-items:center;gap:12px}
.va-chno span{font-family:var(--f-serif);font-size:26px;font-weight:700;color:var(--gold-400);line-height:1}
.va-chno small{font-size:12px;letter-spacing:.18em;color:var(--mist)}
.va-ch h2{font-family:var(--f-serif);font-weight:700;font-size:25px;line-height:1.42;color:var(--paper)}
.va-lead{color:var(--mist-2);font-size:15.5px;line-height:1.85}

.va-qs{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.va-qs p{font-family:var(--f-serif);font-size:20px;line-height:1.55;font-weight:500;color:var(--ivory);padding:14px 0 14px 22px;border-left:1px solid var(--line-gold);position:relative}
.va-qs p::before{content:"";position:absolute;left:-4px;top:26px;width:7px;height:7px;border-radius:50%;background:var(--gold-400)}

.va-gan{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.va-gan div{padding:18px 14px;border-radius:var(--r-lg);background:var(--navy-900);border:1px solid var(--line-dark);display:flex;flex-direction:column;gap:6px}
.va-gan strong{font-family:var(--f-serif);font-size:44px;line-height:1;color:var(--gold-300);font-weight:700}
.va-gan span{font-size:13px;font-weight:700;color:var(--ivory)}
.va-gan p{font-size:13.5px;line-height:1.65;color:var(--mist)}

.va-eye{position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:4/5;border:1px solid var(--line-gold)}
.va-eye img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.va-eye::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,17,32,0) 40%,rgba(11,17,32,.94) 88%)}
.va-eye-copy{position:absolute;inset:auto 0 0;z-index:2;padding:20px 18px;display:flex;flex-direction:column;gap:8px}
.va-eye-copy h3{font-family:var(--f-serif);font-size:24px;color:var(--paper);font-weight:700}
.va-eye-copy .m{font-size:13px;color:var(--gold-300);font-weight:700;letter-spacing:.06em}
.va-eye-copy p{font-size:14px;color:var(--mist-2)}
.va-vs{font-family:var(--f-serif);text-align:center;font-size:16.5px;line-height:1.8;color:var(--ivory);padding:6px 6px}
.va-vs b{color:var(--gold-300);font-weight:700}

.va-journey{position:relative;display:flex;flex-direction:column;gap:0;padding-left:26px}
.va-journey::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--gold-400),var(--line-gold) 50%,var(--gold-400))}
.va-season{font-size:12px;letter-spacing:.2em;color:var(--gold-400);font-weight:700;padding:18px 0 6px;position:relative}
.va-season::before{content:"";position:absolute;left:-24px;top:22px;width:11px;height:11px;border-radius:50%;border:1px solid var(--gold-400);background:var(--navy-950)}
.va-month{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line-dark)}
.va-month:last-child{border-bottom:0}
.va-month .n{font-family:var(--f-serif);font-size:22px;font-weight:700;color:var(--paper);line-height:1.2}
.va-month .n small{display:block;font-family:var(--f-sans);font-size:11px;color:var(--mist);font-weight:500;letter-spacing:.04em}
.va-month .t{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--mist-2)}
.va-month .t b{color:var(--ivory);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line-gold);color:var(--gold-300)}

.va-final{margin-top:56px;padding-block:52px 40px;background:radial-gradient(120% 70% at 50% 0%,rgba(46,90,158,.35),transparent 70%),var(--navy-900);border-top:1px solid var(--line-gold);display:flex;flex-direction:column;gap:18px}
.va-final h2{font-family:var(--f-serif);font-size:26px;line-height:1.42;color:var(--paper);text-align:center}
.va-final > p{text-align:center;color:var(--mist);font-size:14px}
.va-buy{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;padding:12px;border-radius:var(--r-xl);border:1px solid var(--line-gold-strong);background:var(--navy-950)}
.va-buy .th{aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden}
.va-buy .th img{width:100%;height:100%;object-fit:cover}
.va-buy .bd{display:flex;flex-direction:column;gap:6px;min-width:0;justify-content:center}
.va-buy h3{font-size:17px;font-weight:800;color:var(--paper)}
.va-buy .mt{font-size:13px;color:var(--mist)}
.va-buy .btn{grid-column:1/-1}
.va-note{font-size:12.5px;color:var(--mist);text-align:center}

/* ═════════ B안 — 고민 공감형 (사이트 밝은 바탕 계열) ═════════ */
.vb{background:var(--paper);color:var(--ink)}
.vb-hero{padding-block:28px 36px;display:flex;flex-direction:column;gap:18px;background:linear-gradient(180deg,var(--paper-2),var(--paper))}
.vb-hero .eyebrow{color:var(--gold-600)}
.vb-hero h1{font-size:clamp(26px,7.4vw,31px);line-height:1.38;font-weight:800;color:var(--navy-700);letter-spacing:-.02em}
.vb-hero > p{color:var(--muted);font-size:15px}
.vb-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vb-pick a{min-height:64px;border-radius:var(--r-md);border:1px solid var(--line-light);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--ink);font-weight:800;font-size:15px;box-shadow:0 1px 0 rgba(0,0,0,.03);transition:border-color .2s,background .2s}
.vb-pick a span{font-family:var(--f-serif);color:var(--gold-600);font-size:18px;line-height:1}
.vb-pick a:hover{border-color:var(--navy-700);background:#F3F6FB}
.vb-scene{border-radius:var(--r-lg);background:var(--navy-950);padding:12px 12px 16px;display:flex;flex-direction:column;gap:14px;color:var(--ivory)}
.vb-scene .frame{aspect-ratio:4/5}
.vb-scene .frame img{object-position:50% 20%}

.vb-sec{padding-block:44px;display:flex;flex-direction:column;gap:16px}
.vb-sec > h2{font-size:22px;line-height:1.45;font-weight:800;color:var(--navy-700);letter-spacing:-.01em}
.vb-sec > p{color:var(--muted)}
.vb-concern{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:18px 16px;border-radius:var(--r-lg);border:1px solid var(--line-light);background:var(--paper);scroll-margin-top:72px}
.vb-concern .g{width:52px;height:52px;border-radius:50%;background:var(--navy-700);color:var(--gold-300);display:grid;place-items:center;font-family:var(--f-serif);font-size:24px;font-weight:700}
.vb-concern h3{font-size:17px;font-weight:800;color:var(--ink);line-height:1.45}
.vb-concern p{font-size:14.5px;color:var(--muted);margin-top:4px}
.vb-concern .how{margin-top:10px;font-size:13px;color:var(--navy-700);font-weight:700;padding-top:10px;border-top:1px dashed var(--line-light)}

.vb-product{border-radius:var(--r-xl);background:var(--navy-950);color:var(--ivory);padding:14px 14px 18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(11,17,32,.18)}
.vb-product .frame{aspect-ratio:3/4}
.vb-product h3{font-size:22px;font-weight:800;color:var(--paper);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vb-product .sub{font-size:14px;color:var(--gold-300);font-weight:700}
.vb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.vb-list li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14.5px;color:var(--mist-2)}
.vb-list li::before{content:"◆";color:var(--gold-400);font-size:10px;line-height:24px}
.vb-price{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:rgba(169,192,222,.08);font-size:14px}

.vb-turn{position:relative;margin-top:8px;aspect-ratio:4/5;overflow:hidden;background:var(--navy-950)}
.vb-turn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.vb-turn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,17,32,.05) 30%,rgba(11,17,32,.92) 82%)}
.vb-turn-copy{position:absolute;inset:auto 0 0;z-index:2;padding-bottom:26px;display:flex;flex-direction:column;gap:10px;color:var(--ivory)}
.vb-turn-copy h2{font-family:var(--f-serif);font-size:25px;line-height:1.42;color:var(--paper)}
.vb-turn-copy p{color:var(--mist-2);font-size:14.5px}

function Ring({ month, onPick }) {
  const R = 150, r0 = 92, cx = 150, cy = 150;
  const pt = (a, rad) => [cx + rad * Math.sin(a), cy - rad * Math.cos(a)];
  return html`<div class="vd-ring">
    <svg viewBox="-4 -4 308 308" role="group" aria-label="2027년 열두 달">
      ${MONTHS.map((x, i) => {
        const a0 = (i / 12) * 2 * Math.PI + 0.012, a1 = ((i + 1) / 12) * 2 * Math.PI - 0.012;
        const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), [x2, y2] = pt(a1, r0), [x3, y3] = pt(a0, r0);
        const d = `M${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3} Z`;
        const [tx, ty] = pt((a0 + a1) / 2, (R + r0) / 2);
        return html`<g key=${x.m} class=${'seg' + (month === x.m ? ' on' : '')} tabindex="0" role="button" aria-label=${x.m + '월 목차 보기'} aria-pressed=${month === x.m}
          onClick=${() => onPick(x.m, true)} onKeyDown=${e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(x.m, true); } }}>
          <path d=${d} /><text x=${tx} y=${ty} text-anchor="middle" dominant-baseline="central">${x.m}</text>
        </g>`;
      })}
      <circle class="core" cx=${cx} cy=${cy} r=${r0 - 8} />
      <text x=${cx} y=${cy - 12} text-anchor="middle" style=${{fill:'var(--gold-300)', font:'700 34px var(--f-serif)'}}>丁未</text>
      <text x=${cx} y=${cy + 22} text-anchor="middle" style=${{fill:'var(--mist-2)', font:'500 13px var(--f-sans)'}}>${month}월 · ${MONTHS[month-1].jg}</text>
    </svg>
  </div>`;
}

      <div class="vd-tabs" role="tablist" aria-label="상품 정보">
        ${[P.ny, P.tj].map(x => html`<button key=${x.key} id=${'dt-' + x.key} role="tab" aria-selected=${tab === x.key} aria-controls="dpanel" onClick=${() => setTab(x.key)}>${x.short}</button>`)}
      </div>
      <div class="vd-panel" id="dpanel" role="tabpanel" aria-labelledby=${'dt-' + tab} key=${tab}>
        <div class="vd-panel-top">
          <div class="frame"><img src=${p.img} alt=${p.name} /></div>
          <div><span class="paid">유료</span><h3 style=${{marginTop:6}}>${p.name}</h3><p>${p.method}<br/>${p.master} 술사 · ${p.role}</p></div>
        </div>
        <dl class="facts" style=${{margin:0}}>
          ${tab === 'ny' ? html`
            <div><dt>읽는 방식</dt><dd>생년월일시로 세운 사주 명식에 2027년 세운과 열두 달 월운을 겹쳐 읽습니다.</dd></div>
            <div><dt>열두 달</dt><dd>달마다 마음·돈·일 세 갈래, 조심할 달과 밀어도 되는 달</dd></div>
            <div><dt>입력 정보</dt><dd>생년월일·태어난 시(모르면 「모름」)</dd></div>` : html`
            <div><dt>읽는 방식</dt><dd>144괘 가운데 2027년의 본괘를 세워 한 해의 길흉을 읽는 전통 방식입니다.</dd></div>

            <div><dt>입력 정보</dt><dd>생년월일 <${Todo}>세부 입력 항목<//></dd></div>`}

    <section class="vd-sec wrap" aria-labelledby="d4">

    <section class="vd-sec wrap" aria-labelledby="d5" style=${{paddingBottom:40}}>

        <div><dt>열람</dt><dd><${Todo}>열람 기간·다시 보기<//></dd></div>

    <${Footer} />

    <nav class="vd-bar wrap" aria-label="상품 구매">
      <${Buy} p=${P.ny} cls="gold"><span>신년운세</span><small>사주 · 유료</small><//>
      <${Buy} p=${P.tj}><span>토정비결</span><small>144괘 · 유료</small><//>
    </nav>
  </main>`;
}

/* ═════════ 리뷰 셸 ═════════ */
const VARIANTS = [
  { id:'a', label:'A', name:'스토리텔링', C:PageA },
  { id:'b', label:'B', name:'고민 공감', C:PageB },
  { id:'c', label:'C', name:'상품 비교', C:PageC },
  { id:'d', label:'D', name:'열두 달', C:PageD },
];
const WIDTHS = [375, 390, 430, 448];
const readHash = () => { const h = (location.hash || '').slice(1); return VARIANTS.some(v => v.id === h) ? h : 'a'; };

function App() {
  const [v, setV] = useState(readHash);
  const [w, setW] = useState(448);
  useEffect(() => {
    const on = () => setV(readHash());
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  useEffect(() => { document.documentElement.style.setProperty('--col', w + 'px'); }, [w]);
  const go = id => { if (location.hash !== '#' + id) location.hash = id; setV(id); window.scrollTo(0, 0); };
  const Cur = VARIANTS.find(x => x.id === v).C;
  return html`<${React.Fragment}>
    <div class="shell-bar" role="navigation" aria-label="내부 검토용 시안 전환">
      <div class="shell-inner">
        <span class="shell-tag">내부 검토 · 랜딩 미포함</span>
        <div class="shell-tabs">
          ${VARIANTS.map(x => html`<button key=${x.id} aria-pressed=${v === x.id} onClick=${() => go(x.id)}><b>${x.label}</b><span>${x.name}</span></button>`)}
        </div>
        <div class="shell-widths" aria-label="미리보기 폭">
          ${WIDTHS.map(n => html`<button key=${n} aria-pressed=${w === n} onClick=${() => setW(n)}>${n}</button>`)}
        </div>
      </div>
    </div>
    <div class="stage"><div class="phone" key=${v}><${Cur} /></div></div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
